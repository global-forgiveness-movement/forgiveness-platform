<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Global Forgiveness Movement</title>
  <meta name="robots" content="noindex">

  <!-- GitHub Pages serves this file at any missing path, so it is fully
       self-contained: no relative assets, no shell script. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f4efe3; color: #24333e; text-align: center;
      font-family: 'Nunito Sans', 'Avenir', 'Segoe UI', sans-serif; padding: 2rem; }
    h1 { font-family: 'Poppins', 'Trebuchet MS', sans-serif; color: #123b53; margin: 0.3rem 0 0.6rem; }
    a.btn { display: inline-block; margin-top: 1rem; background: #1b7f72; color: #fff;
      text-decoration: none; font-weight: 600; padding: 0.75rem 1.6rem; border-radius: 999px; }
    svg { width: 40px; height: 40px; }
  </style>
</head>
<body>
  <div>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C7 7 4 12 4 16a8 8 0 0 0 16 0c0-4-3-9-8-14z" fill="#1b7f72" transform="rotate(40 12 12)"/></svg>
    <h1>That page doesn’t exist</h1>
    <p>No harm done. The whole site is a few steps away.</p>
    <a class="btn" href="javascript:history.back()">Go back</a>
    <a class="btn" id="homeLink" href="/">Back to the start</a>
  </div>
  <script>
    /* Point home at the site root whether we're on github.io/<repo>/ or a domain. */
    var onPages = /\.github\.io$/.test(location.hostname);
    var seg = location.pathname.split('/')[1];
    document.getElementById('homeLink').href = onPages && seg ? '/' + seg + '/' : '/';
  </script>
</body>
